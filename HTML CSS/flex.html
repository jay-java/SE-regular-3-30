    <style>
        .icon {
            height: 80px;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            font-weight: bold;
        }

        .icon:hover {
            background-color: bisque;
            transform: scale(1.05);

        }

        .grid {
            display: grid;
            gap: 20px;
            max-width: 500px;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            margin: auto;
        }
    </style>
</head>
